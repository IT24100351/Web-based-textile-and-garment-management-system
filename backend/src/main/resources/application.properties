spring.application.name=tgms-api
spring.config.import=optional:file:.env[.properties]

# Do not let a generic host-level DEBUG variable expose request bodies or SQL parameters.
debug=${TGMS_DEBUG:false}
spring.mvc.log-request-details=false
logging.level.org.springframework.web=${TGMS_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.jdbc.core=${TGMS_SQL_LOG_LEVEL:INFO}

server.port=${PORT:3000}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

tgms.client-origin=${CLIENT_ORIGIN:http://localhost:5173}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.hikari.connection-timeout=5000

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Product photos uploaded by sales officers are stored outside the database.
tgms.products.image-storage-directory=${PRODUCT_IMAGE_DIRECTORY:./data/product-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

tgms.auth.jwt-secret=${JWT_SECRET}
tgms.auth.issuer=tgms-api
tgms.auth.session-hours=${JWT_SESSION_HOURS:8}
tgms.auth.cookie-secure=${COOKIE_SECURE:true}

# Authentication email delivery
tgms.auth.mail.smtp-enabled=${SMTP_ENABLED:false}
tgms.auth.mail.from=${MAIL_FROM:no-reply@example.com}

# New-customer email verification
tgms.auth.verification.ttl-minutes=${EMAIL_VERIFICATION_TTL_MINUTES:15}
tgms.auth.verification.resend-seconds=${EMAIL_VERIFICATION_RESEND_SECONDS:60}
tgms.auth.verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}

# Password reset / account recovery
tgms.auth.reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
tgms.auth.reset.resend-seconds=${PASSWORD_RESET_RESEND_SECONDS:60}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_USE_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_USE_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}

# In-system operational notifications (TGMS-73)
tgms.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
