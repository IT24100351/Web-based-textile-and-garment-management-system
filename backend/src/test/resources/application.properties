spring.datasource.url=jdbc:h2:mem:tgms;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

tgms.client-origin=http://localhost:5173
tgms.auth.jwt-secret=test-only-secret-must-be-at-least-32-bytes-long
tgms.auth.issuer=tgms-api
tgms.auth.session-hours=8
tgms.auth.cookie-secure=false

# Legacy test helpers may issue signed sessions for synthetic users. Production defaults false.
tgms.auth.allow-non-persisted-session-identities=true

tgms.auth.reset.ttl-minutes=30
tgms.auth.reset.resend-seconds=60
tgms.auth.mail.smtp-enabled=false
tgms.auth.mail.from=no-reply@test.invalid
tgms.auth.verification.ttl-minutes=15
tgms.auth.verification.resend-seconds=60
tgms.auth.verification.max-attempts=5

# Keep unrelated integration tests deterministic; TGMS-73 notification tests enable this explicitly.
tgms.notifications.enabled=false
